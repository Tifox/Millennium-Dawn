 # EKRE Political Events
 estonia.401.t: "EKRE Enters Government Coalition"
 estonia.401.d: "Following the March elections, the Conservative People's Party of Estonia (EKRE) has entered the government as part of a coalition with the Centre Party and Isamaa. Prime Minister Jüri Ratas leads the new cabinet, with EKRE securing key ministerial positions.\n\nMart Helme becomes Interior Minister while his son Martin Helme takes the Finance Ministry. This marks the first time since independence that a far-right party has held power in Estonia.\n\nThe new government has already sparked controversy, with critics warning about the impact on Estonia's international reputation and democratic norms."
 estonia.401.a: "A controversial new chapter begins."

 estonia.402.t: "Coalition Government Collapses"
 estonia.402.d: "Prime Minister Jüri Ratas has resigned following a corruption scandal involving the Porto Franco real estate development. The Centre Party's involvement in the scandal has brought down the entire coalition government, ending EKRE's controversial time in power.\n\nThe Reform Party, led by Kaja Kallas, is expected to form a new government. This marks the end of a turbulent chapter in Estonian politics, as the far-right EKRE loses its ministerial positions.\n\nEuropean partners have quietly expressed relief at the development."
 estonia.402.a: "The coalition crumbles."

 estonia.403.t: "EKRE Electoral Breakthrough"
 estonia.403.d: "The parliamentary elections have concluded with a stunning result for the Conservative People's Party (EKRE). The nationalist party has won 17.8% of the vote and secured 19 seats in the Riigikogu, making them the third-largest party.\n\nThis represents a major breakthrough for the party, which has transformed from a marginal political force to a potential kingmaker in coalition negotiations. Their anti-immigration and euroskeptic message has resonated with a significant portion of the electorate."
 estonia.403.a: "The political landscape shifts."

 estonia.404.t: "EKRE Maintains Electoral Support"
 estonia.404.d: "Despite the scandals that ended their time in government, EKRE has maintained substantial support in the parliamentary elections. The party won 16.1% of the vote and 17 seats, a slight decline from 2019 but still a significant presence.\n\nWhile they will remain in opposition as the Reform Party leads the new government, EKRE continues to represent a major political force in Estonian politics."
 estonia.404.a: "The far-right remains a factor."

 EST_ekre_in_government: "EKRE Coalition Government"
 EST_ekre_in_government_desc: "The far-right Conservative People's Party is part of the governing coalition, leading to domestic controversy and strained relations with European partners."

 EST_far_right_government: "Far-Right Coalition Partner"

 # Ukraine Response Events (TASK-008)
 estonia.500.t: "Russia Invades Ukraine"
 estonia.500.d: "The unthinkable has happened. Russian forces have launched a full-scale invasion of Ukraine, attacking from multiple directions. Cities are being bombarded, and Ukrainian forces are engaged in desperate defense.\n\nAs a nation that knows firsthand the threat of Russian aggression, Estonia must respond. Our history under Soviet occupation gives us unique moral clarity on this issue. The question is how strongly we commit to Ukraine's defense.\n\nPrime Minister Kallas has already called for the strongest possible response, including Russia's removal from SWIFT and maximum military aid to Ukraine."
 estonia.500.a: "Stand with Ukraine - whatever it takes."
 estonia.500.b: "Condemn the invasion but measure our response."

 estonia.501.t: "Ukrainian Refugees Seek Shelter"
 estonia.501.d: "As Russian forces continue their assault on Ukraine, tens of thousands of Ukrainians are fleeing the violence. Many are arriving in Estonia, seeking safety and temporary shelter.\n\nOur small nation faces a decision about how generously to welcome these refugees. With our population of only 1.3 million, even modest refugee numbers represent a significant demographic impact. However, our own history of occupation gives us deep empathy for their plight.\n\nThe government is preparing emergency measures for housing, work permits, and integration assistance."
 estonia.501.a: "Open our doors wide - they are our brothers and sisters."
 estonia.501.b: "Accept refugees within our capacity."

 estonia.502.t: "Estonia Leads Sanctions Push"
 estonia.502.d: "As the European Union debates its response to Russia's invasion, Estonia has emerged as one of the loudest voices calling for maximum sanctions. Prime Minister Kaja Kallas has been tireless in her advocacy, calling for Russia's removal from SWIFT, energy embargoes, and comprehensive economic isolation.\n\n'This is not a time for half-measures,' Kallas declared. 'Russia must pay the full price for its aggression.'\n\nHer stance has earned respect from Baltic neighbors and Eastern European allies, while Western European countries are increasingly persuaded by her arguments. However, this vocal opposition has made Estonia a particular target of Russian hostility."
 estonia.502.a: "Lead the charge for maximum sanctions."
 estonia.502.b: "Support sanctions without seeking the spotlight."

 estonia.503.t: "NATO Upgrades Baltic Defense"
 estonia.503.d: "In response to Russia's invasion of Ukraine, NATO has announced a major upgrade to its presence in the Baltic states. The Enhanced Forward Presence battlegroups will be upgraded to brigade-capable Forward Land Forces, representing a fundamental shift in the alliance's eastern defense posture.\n\nThe UK-led battlegroup in Estonia will be reinforced and prepared for rapid expansion to brigade strength if needed. This represents NATO's strongest commitment yet to Baltic defense.\n\nAdditional troops, equipment, and pre-positioned supplies will enhance our defensive capabilities significantly."
 estonia.503.a: "NATO's commitment to our defense is ironclad."

