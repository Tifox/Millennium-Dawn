 # Defense Spending Ideas
 EST_defense_spending_3: "Enhanced Defense Budget (3%)"
 EST_defense_spending_3_desc: "Estonia has increased defense spending to 3% of GDP, enabling improved military readiness and faster training."
 EST_defense_spending_4: "Major Defense Investment (4%)"
 EST_defense_spending_4_desc: "Estonia's 4% GDP defense spending enables significant military modernization and enhanced offensive capabilities."
 EST_defense_spending_5: "Maximum Defense Posture (5%)"
 EST_defense_spending_5_desc: "At 5% of GDP, Estonia has the highest defense spending in NATO, enabling rapid military expansion and full-spectrum capability enhancement."

 # NATO Forward Forces
 EST_nato_forward_forces: "NATO Forward Land Forces"
 EST_nato_forward_forces_desc: "NATO has upgraded its Baltic presence from Enhanced Forward Presence to Forward Land Forces, with brigade-capable forces ready to defend Estonian territory."

 # Decision Category
 EST_defense_spending_category: "Defense Spending"
 EST_defense_spending_category_desc: "Decisions related to Estonia's defense budget and military modernization in response to the Russian threat."

 # Defense Spending Decisions
 EST_increase_defense_spending_3: "Increase Defense Spending to 3%"
 EST_increase_defense_spending_3_desc: "In response to the Russian threat, we will increase defense spending to 3% of GDP, exceeding NATO's 2% guideline."
 EST_increase_defense_spending_4: "Increase Defense Spending to 4%"
 EST_increase_defense_spending_4_desc: "We will further increase defense spending to 4% of GDP, making Estonia one of the highest defense spenders in NATO."
 EST_increase_defense_spending_5: "Increase Defense Spending to 5%"
 EST_increase_defense_spending_5_desc: "Estonia will become the NATO leader in defense spending at 5% of GDP, reflecting the existential threat we face."
